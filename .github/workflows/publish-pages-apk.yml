name: Build and Publish Nadeem Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Firebase app configuration
        shell: bash
        run: |
          cat > android-app/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "178796478534",
              "project_id": "nadeem-mobile-58f18"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:178796478534:android:954074f9a29a020cf04a47",
                "android_client_info": {"package_name": "com.nadeemmobile.lock"}
              },
              "api_key": [{"current_key": "github-actions-build-key-not-required"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Build release APK
        working-directory: android-app
        run: ./gradlew clean assembleRelease -PnadeemApiBaseUrl=https://nadeem-mobiles-api.user03174904469.workers.dev

      - name: Prepare Pages site
        run: |
          rm -rf site
          mkdir -p site/downloads
          cp -R docs/. site/
          cp android-app/app/build/outputs/apk/release/app-release.apk site/downloads/nadeem-mobile-lock.apk
          ls -lh site/downloads/nadeem-mobile-lock.apk

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
