<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nadeem Mobiles — Control Center</title>
<meta name="description" content="Nadeem Mobiles customer, payment, enrollment and device control dashboard">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="toastHost" class="toast-host"></div>
<div id="loginView" class="login-view">
  <div class="login-shell">
    <div class="brand-mark">NM</div>
    <div class="eyebrow">Nadeem Mobiles</div>
    <h1>Control Center</h1>
    <p class="muted">Manage customers, payments and enrolled phones from one place.</p>
    <form id="loginForm" class="stack-form">
      <label>Username<input id="loginUsername" autocomplete="username" required></label>
      <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary wide" type="submit">Sign in</button>
      <div id="loginError" class="form-error"></div>
    </form>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand"><div class="brand-mark small">NM</div><div><strong>Nadeem Mobiles</strong><span>Control Center</span></div></div>
    <nav id="nav" class="nav">
      <button data-view="overview" class="nav-item active">Overview</button>
      <button data-view="customers" class="nav-item">Customers</button>
      <button data-view="payments" class="nav-item">Payments</button>
      <button data-view="devices" class="nav-item">Devices</button>
      <button data-view="enrollments" class="nav-item">Enrollments</button>
      <button data-view="activity" class="nav-item">Activity</button>
      <button data-view="settings" class="nav-item">Settings</button>
    </nav>
    <div class="side-footer"><div class="connection-dot"></div><span id="connectionLabel">Checking backend…</span></div>
  </aside>

  <main class="main-shell">
    <header class="topbar">
      <div><div class="eyebrow" id="pageEyebrow">Nadeem Mobiles</div><h2 id="pageTitle">Overview</h2></div>
      <div class="top-actions"><button id="refreshBtn" class="icon-button" title="Refresh">↻</button><button id="addCustomerBtn" class="primary">+ New customer</button><button id="logoutBtn" class="ghost">Sign out</button></div>
    </header>

    <div id="content" class="content"></div>
  </main>
</div>

<div id="modalHost"></div>
<script src="config.js"></script><script src="app.js"></script>
</body>
</html>
